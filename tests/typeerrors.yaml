order: 3
name: TypeErrors
tests:
  - name: assign
    description: Assign int to string
    code: |
      import "strings"

      str = "foo"
      str = 1
    errors:
      - typeerrors/assign.lsh Ln:4 Col:1 you cannot assign an int value to the variable 'str' of type string
  - name: multi assign
    description: Assign int to string
    code: |
      import "strings"

      str = "foo"
      n, str = 0, 1
    errors:
      - typeerrors/multi assign.lsh Ln:4 Col:4 you cannot assign an int value to the variable 'str' of type string
  - name: assign in function
    description: Assign int to string inside a function body
    code: |
      func f() {
        str = "foo"
        str = 1
      }
    errors:
      - typeerrors/assign in function.lsh Ln:3 Col:3 you cannot assign an int value to the variable 'str' of type string
  - name: assign to param
    description: Assign string to an int parameter
    code: |
      func f(n int) {
        if n > 0 {
          n = "foo"
        }
      }
    errors:
      - typeerrors/assign to param.lsh Ln:3 Col:5 you cannot assign an string value to the variable 'n' of type int
  - name: undefined variable
    code: |
      println(nope)
    errors:
      - typeerrors/undefined variable.lsh Ln:1 Col:9 variable 'nope' is not defined
  - name: undefined function
    code: |
      x = 1
      foo(x)
      y = bar()
    errors:
      - typeerrors/undefined function.lsh Ln:2 Col:1 function foo not found
      - typeerrors/undefined function.lsh Ln:3 Col:5 function bar not found
  - name: variable out of scope
    code: |
      if true {
        inner = 1
      }
      println(inner)
    errors:
      - typeerrors/variable out of scope.lsh Ln:4 Col:9 variable 'inner' is not defined
  - name: top level variable in function
    code: |
      top = 1
      func f() {
        println(top)
      }
    errors:
      - typeerrors/top level variable in function.lsh Ln:3 Col:11 variable 'top' is not defined
  - name: operators
    code: |
      a = 1 + "a"
      b = "a" - "b"
      c = 1 == "a"
      d = !5
      e = -"x"
      f = 1 && true
      g = [1] == [1]
      h = 1 < 2 || "x" > "y"
    errors:
      - "typeerrors/operators.lsh Ln:1 Col:5 operator '+' can't be used with int and string"
      - "typeerrors/operators.lsh Ln:2 Col:5 operator '-' can't be used with string and string"
      - "typeerrors/operators.lsh Ln:3 Col:5 operator '==' can't be used with int and string"
      - "typeerrors/operators.lsh Ln:4 Col:5 operator '!' can't be used with int"
      - "typeerrors/operators.lsh Ln:5 Col:5 operator '-' can't be used with string"
      - "typeerrors/operators.lsh Ln:6 Col:5 operator '&&' can't be used with int and bool"
      - "typeerrors/operators.lsh Ln:7 Col:5 operator '==' can't be used with []int and []int"
      - "typeerrors/operators.lsh Ln:8 Col:14 operator '>' can't be used with string and string"
  - name: conditions
    code: |
      if 1 {
        println("x")
      }
      for i = 0; i; i = i + 1 {
        println(i)
      }
      x = 1 ? "a" : "b"
      y = true ? "a" : 1
    errors:
      - "typeerrors/conditions.lsh Ln:1 Col:1 if condition must be of type bool, not int"
      - "typeerrors/conditions.lsh Ln:4 Col:1 for condition must be of type bool, not int"
      - "typeerrors/conditions.lsh Ln:7 Col:5 ternary condition must be of type bool, not int"
      - "typeerrors/conditions.lsh Ln:8 Col:5 ternary branches must have the same type, not string and int"
  - name: index and slice
    code: |
      n = 5
      a = n[0]
      b = "abc"["x"]
      c = n[1:2]
      d = [1, 2][0:"x"]
    errors:
      - "typeerrors/index and slice.lsh Ln:2 Col:5 cannot index a value of type int"
      - "typeerrors/index and slice.lsh Ln:3 Col:5 index must be of type int, not string"
      - "typeerrors/index and slice.lsh Ln:4 Col:5 cannot slice a value of type int"
      - "typeerrors/index and slice.lsh Ln:5 Col:5 slice bound must be of type int, not string"
  - name: no follow-up errors
    code: |
      y = bar()
      a, b = bar()
      z = y + 1
      w = nope + 1
      if nope {
        println(a, b, z, w, a[0], -y)
      }
      y = 1
    errors:
      - "typeerrors/no follow-up errors.lsh Ln:1 Col:5 function bar not found"
      - "typeerrors/no follow-up errors.lsh Ln:2 Col:8 function bar not found"
      - "typeerrors/no follow-up errors.lsh Ln:4 Col:5 variable 'nope' is not defined"
      - "typeerrors/no follow-up errors.lsh Ln:5 Col:4 variable 'nope' is not defined"
  - name: wrong number of expressions in function
    code: |
      func f() {
        if true {
          a, b = 1
        }
      }
    errors:
      - "typeerrors/wrong number of expressions in function.lsh Ln:3 Col:5 Wrong number of expressions"
  - name: call arguments
    code: |
      func add(a int, b int) int {
        return a + b
      }
      x = add(1)
      y = add(1, 2, 3)
      z = add(1, "2")
      add()
      w = add(1, 2) + 1
    errors:
      - "typeerrors/call arguments.lsh Ln:4 Col:5 add takes 2 arguments, not 1"
      - "typeerrors/call arguments.lsh Ln:5 Col:5 add takes 2 arguments, not 3"
      - "typeerrors/call arguments.lsh Ln:6 Col:5 argument 2 of add must be of type int, not string"
      - "typeerrors/call arguments.lsh Ln:7 Col:1 add takes 2 arguments, not 0"
  - name: package call arguments
    code: |
      import "/math"
      import "strings"
      x = math.double(1, 2)
      y = strings.hasPrefix(1, "a")
      z = strings.join(["a"], ["b"])
    errors:
      - "typeerrors/package call arguments.lsh Ln:3 Col:10 math.double takes 1 argument, not 2"
      - "typeerrors/package call arguments.lsh Ln:4 Col:13 argument 1 of strings.hasPrefix must be of type string, not int"
      - "typeerrors/package call arguments.lsh Ln:5 Col:13 argument 2 of strings.join must be of type string, not []string"
  - name: multiple values as arguments
    code: |
      func pair() int, int {
        return 1, 2
      }
      func one(a int) {
      }
      one(pair())
    errors:
      - "typeerrors/multiple values as arguments.lsh Ln:6 Col:1 one takes 1 argument, not 2"
  - name: builtin arguments
    code: |
      a = len()
      b = len(1)
      c = append()
      d = append(1, 2)
      e = append([1], 2, "x")
      println("a", [1, 2])
      o, er, code = execVar()
      o, er, code = execVar("ls", ["-l"])
    errors:
      - "typeerrors/builtin arguments.lsh Ln:1 Col:5 len takes 1 argument, not 0"
      - "typeerrors/builtin arguments.lsh Ln:2 Col:5 argument 1 of len must be an array or string, not int"
      - "typeerrors/builtin arguments.lsh Ln:3 Col:5 append takes at least 1 argument, not 0"
      - "typeerrors/builtin arguments.lsh Ln:4 Col:5 argument 1 of append must be an array, not int"
      - "typeerrors/builtin arguments.lsh Ln:5 Col:5 argument 3 of append must be of type int, not string"
      - "typeerrors/builtin arguments.lsh Ln:6 Col:1 argument 2 of println can't be of type []int"
      - "typeerrors/builtin arguments.lsh Ln:7 Col:15 execVar takes at least 1 argument, not 0"
      - "typeerrors/builtin arguments.lsh Ln:8 Col:15 argument 2 of execVar can't be of type []string"
  - name: return values
    code: |
      func one() int {
        return "a"
      }
      func two() int, string {
        return 1
      }
      func none() {
        if true {
          return 1
        }
      }
      return 1
    errors:
      - "typeerrors/return values.lsh Ln:12 Col:1 return outside of a function"
      - "typeerrors/return values.lsh Ln:2 Col:3 return value 1 of one must be of type int, not string"
      - "typeerrors/return values.lsh Ln:5 Col:3 function two returns 2 values, not 1"
      - "typeerrors/return values.lsh Ln:9 Col:5 function none returns 0 values, not 1"
  - name: no follow-up errors in calls
    code: |
      func add(a int, b int) int {
        return bar()
      }
      x = add(nope, 1)
      y = len(bar())
      z = append(nope, 1)
      println(add(1, 2) + 1)
    errors:
      - "typeerrors/no follow-up errors in calls.lsh Ln:4 Col:9 variable 'nope' is not defined"
      - "typeerrors/no follow-up errors in calls.lsh Ln:5 Col:9 function bar not found"
      - "typeerrors/no follow-up errors in calls.lsh Ln:6 Col:12 variable 'nope' is not defined"
      - "typeerrors/no follow-up errors in calls.lsh Ln:2 Col:10 function bar not found"
  - name: missing return
    code: |
      func empty() int {
      }
      func ifOnly(a int) int {
        if a > 1 {
          return 1
        }
      }
      func loop(a int) int {
        for i = 0; i < a; i = i + 1 {
          return i
        }
      }
      func none() {
      }
      func ifElse(a int) int {
        if a > 1 {
          return 1
        } else {
          println(a)
        }
      }
      func elseIf(a int) int {
        if a > 1 {
          return 1
        } else if a > 0 {
          return 2
        }
      }
      func allReturn(a int) int {
        if a > 1 {
          return 1
        } else if a > 0 {
          return 2
        } else {
          return 3
        }
      }
    errors:
      - "typeerrors/missing return.lsh Ln:2 Col:1 missing return at the end of function empty"
      - "typeerrors/missing return.lsh Ln:7 Col:1 missing return at the end of function ifOnly"
      - "typeerrors/missing return.lsh Ln:12 Col:1 missing return at the end of function loop"
      - "typeerrors/missing return.lsh Ln:21 Col:1 missing return at the end of function ifElse"
      - "typeerrors/missing return.lsh Ln:28 Col:1 missing return at the end of function elseIf"
  - name: return without values in a function with return types
    code: |
      func f() int {
        return
      }
    errors:
      - "typeerrors/return without values in a function with return types.lsh Ln:2 Col:3 function f returns 1 value, not 0"
  - name: call without a value used as value
    code: |
      import "/greet"

      func f(a int) {
        println(a)
      }
      func g() {
        return f(1)
      }
      f(1, println("x"))
      x = 1, println("x")
      a = [println("x")]
      b = len(f(1)) + 1
      if f(1) {
      }
      c = greet.hello("a")
    errors:
      - "typeerrors/call without a value used as value.lsh Ln:7 Col:10 f doesn't return a value"
      - "typeerrors/call without a value used as value.lsh Ln:9 Col:6 println doesn't return a value"
      - "typeerrors/call without a value used as value.lsh Ln:10 Col:8 println doesn't return a value"
      - "typeerrors/call without a value used as value.lsh Ln:11 Col:6 println doesn't return a value"
      - "typeerrors/call without a value used as value.lsh Ln:12 Col:9 f doesn't return a value"
      - "typeerrors/call without a value used as value.lsh Ln:13 Col:4 f doesn't return a value"
      - "typeerrors/call without a value used as value.lsh Ln:15 Col:11 greet.hello doesn't return a value"
  - name: else if condition must be bool
    code: |
      if true {
      } else if 1 {
      }
    errors:
      - "typeerrors/else if condition must be bool.lsh Ln:2 Col:8 if condition must be of type bool, not int"
  - name: blank identifier as value
    code: |
      _ = 1
      x = _
      println(_ + 1)
      func f(_ int) int {
        return _
      }
    errors:
      - "typeerrors/blank identifier as value.lsh Ln:2 Col:5 cannot use _ as value"
      - "typeerrors/blank identifier as value.lsh Ln:3 Col:9 cannot use _ as value"
      - "typeerrors/blank identifier as value.lsh Ln:5 Col:10 cannot use _ as value"
  - name: variables of if aren't visible in else
    code: |
      if true {
        x = 1
      } else {
        println(x)
      }
    errors:
      - "typeerrors/variables of if aren't visible in else.lsh Ln:4 Col:11 variable 'x' is not defined"
