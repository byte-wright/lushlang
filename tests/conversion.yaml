order: 2
name: Conversion
tests:
  - name: string plus int and bool
    description: a string on the left takes the text of an int or bool on the right
    code: |
      func twice(x int) int {
        return x * 2
      }

      n = 42
      ok = n > 40
      a = [1, 2]
      println("n=" + n, "neg=" + -n, "ok=" + ok, "lit=" + 7 + true)
      println("sum=" + (n + 1), "sum=" + n + 1)
      println("f=" + twice(4), "a=" + a[1], "len=" + len(a), "" + n + "!")
      s = "items: "
      s += n
      s += ", " + false
      println(s)
    expected: |
      n=42 neg=-42 ok=true lit=7true
      sum=43 sum=421
      f=8 a=2 len=2 42!
      items: 42, false

  - name: string plus global int
    code: |
      global count = 3

      func label() string {
        return "count=" + count
      }

      println(label())
    expected: |
      count=3

  - name: parseInt valid
    description: an optional sign and decimal digits, leading zeros don't make it octal
    code: |
      for s in ["0", "-0", "+0", "42", "-42", "+42", "007", "-007", "08", "0009223372036854775807", "9223372036854775807", "-9223372036854775808"] {
        n = try parseInt(s)
        println(s, n)
      }
    expected: |
      0 0
      -0 0
      +0 0
      42 42
      -42 -42
      +42 42
      007 7
      -007 -7
      08 8
      0009223372036854775807 9223372036854775807
      9223372036854775807 9223372036854775807
      -9223372036854775808 -9223372036854775808

  - name: parseInt invalid
    description: anything else, also an int out of range, is an error and runs nothing
    code: |
      for s in ["", "-", "+", "-+5", " 5", "5 ", "5\n", "1_000", "0x10", "1e3", "٣", "9223372036854775808", "-9223372036854775809", "99999999999999999999", "$(echo hi >&2)", "a[$(echo pwned >&2)]", "*"] {
        n = parseInt(s) catch err {
          println("[" + err + "]")
          continue
        }
        println("not reached", n)
      }
    expected: |
      ["" is not an int]
      ["-" is not an int]
      ["+" is not an int]
      ["-+5" is not an int]
      [" 5" is not an int]
      ["5 " is not an int]
      ["5
      " is not an int]
      ["1_000" is not an int]
      ["0x10" is not an int]
      ["1e3" is not an int]
      ["٣" is not an int]
      ["9223372036854775808" is out of the int range]
      ["-9223372036854775809" is out of the int range]
      ["99999999999999999999" is out of the int range]
      ["$(echo hi >&2)" is not an int]
      ["a[$(echo pwned >&2)]" is not an int]
      ["*" is not an int]

  - name: parseInt result is a plain int
    description: the result works in arithmetic and comparisons like a literal
    code: |
      a = try parseInt("08")
      b = try parseInt("-007")
      println(a * 2, b + 1, a == 8, b < 0, "b=" + b)
    expected: |
      16 -6 true true b=-7

  - name: parseInt of arguments
    args: ["12", "x", "30"]
    code: |
      sum = 0
      for a in args() {
        n = parseInt(a) catch err {
          println("skipped:", err)
          continue
        }
        sum += n
      }
      println("sum=" + sum)
    expected: |
      skipped: "x" is not an int
      sum=42

  - name: parseInt with try at the top level
    description: the message goes to stderr and the script ends with exit code 1
    code: |
      println(try parseInt("7") + 1)
      n = try parseInt("seven")
      println("not reached", n)
    expected: |
      8
    stderr: |
      "seven" is not an int
    exit: 1

  - name: parseInt keeps the old value on a failure
    code: |
      port = 8080
      port = parseInt("x") catch _ {
      }
      println(port)
    expected: |
      8080

  - name: parseInt in the C locale
    env: [LC_ALL=C]
    code: |
      for s in ["123", "٣", "1€"] {
        n = parseInt(s) catch err {
          println(err)
          continue
        }
        println(s, n)
      }
    expected: |
      123 123
      "٣" is not an int
      "1€" is not an int
