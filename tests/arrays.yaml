order: 3
name: Arrays
tests:
  - name: declaration
    description: Arrays are declared like [a, b, c]
    code: |
      import "strings"

      names = ["albert", "boris", "chad"]
      println(names[2], names[1], names[0])

      numbers = [2, 4, 6]
      println(numbers[1] + numbers[2] * numbers[0])

      println(strings.join(append([]string, "foo", "bar"), "."))
    expected: |
      chad boris albert
      16
      foo.bar

  - name: append
    description: Add elements to an array
    code: |
      import "strings"

      names = ["albert", "anke"]
      names = append(names, "boris", "chad", "the mil'le\"r")
      println(strings.join(names, "-"))
    expected: |
      albert-anke-boris-chad-the mil'le"r

  - name: join array
    description: The join method joins an array into a string.
    code: |
      import "strings"

      names = ["albert", "boris", "chad", "the mil'le\"r"]
      println(strings.join(names, ", "))
    expected: |
      albert, boris, chad, the mil'le"r

  - name: slice array
    description: Arrays can be sliced
    code: |
      import "strings"

      names = ["albert", "boris", "chad", "dario", "elmir"]
      sliced = names[1:4]
      println(strings.join(sliced, ", "))

      println(strings.join(["a", "r", "g", "h", "o"][2:4], "_"))
    expected: |
      boris, chad, dario
      g_h

  - name: array length
    description: Arrays can be sliced
    code: |
      import "strings"

      names = ["albert", "boris", "chad", "dario", "elmir"]
      println(len(names))
      println(len(append(names, "fifi")))
    expected: |
      5
      6

  - name: assign an element
    code: |
      import "strings"

      a = ["a", "b", "c"]
      a[0] = "x"
      i = 1
      a[i + 1] = a[i] + "!"
      println(strings.join(a, " "))

      n = [1, 2, 3]
      n[1] += 10
      n[2] *= n[1]
      n[0] -= 5
      println(n[0], n[1], n[2])

      squares = [0, 0, 0]
      for i = 0; i < 3; i += 1 {
        squares[i] = i * i
      }
      println(squares[0], squares[1], squares[2])
    expected: |
      x b b!
      -4 12 36
      0 1 4

  - name: assign several elements
    description: like in Go, the indexes and values are evaluated before the assignments, which go from left to right
    code: |
      a = [1, 2, 3]
      a[0], a[2] = a[2], a[0]
      println(a[0], a[1], a[2])

      i = 0
      i, a[i] = 2, 9
      println(i, a[0], a[2])

      b = [0]
      b, b[0] = [5, 6], 7
      println(len(b), b[0], b[1])

      old = [1]
      c, old[0] = old, 2
      old[0], d = 3, old
      println(c[0], d[0], old[0])
    expected: |
      3 2 1
      2 9 1
      2 7 6
      1 2 3

  - name: compound assignment evaluates the index once
    code: |
      global calls = 0

      func next() int {
        global calls += 1
        return calls - 1
      }

      a = [10, 20]
      a[next()] += 1
      a[next()] += 5
      println(a[0], a[1], calls)
    expected: |
      11 25 2

  - name: arrays are values
    description: an assignment and a call copy the array, so an element assignment only changes the variable
    code: |
      func change(a []string) []string {
        a[0] = "changed"
        return a
      }

      a = ["a", "b"]
      b = a
      a[0] = "x"
      println(a[0], b[0])

      c = change(a)
      println(a[0], c[0])

      for x in a {
        a[1] = "y"
        println(x)
      }
      println(a[1])
    expected: |
      x a
      x changed
      x
      b
      y

  - name: assign an element in a catch
    description: when the call fails, the element keeps its value
    code: |
      func half(n int) int, error {
        if n % 2 != 0 {
          fail("odd")
        }
        return n / 2
      }

      a = [0, 0]
      a[0] = half(4) catch _ {
      }
      a[1] = half(3) catch err {
        println(err)
      }
      println(a[0], a[1])
    expected: |
      odd
      2 0
