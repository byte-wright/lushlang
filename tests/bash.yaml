order: 3
name: Bash
tests:
  - name: bash fun
    description:
    code: |
      import "strings"

      println(strings.hasPrefix("foo", "f"))
      println(strings.hasPrefix("foo", "o"))
    expected: |
      true
      false


  - name: env var
    code: |
      v = $LUSH_TEST
      println(v)
    expected: |
      hello

  - name: identifiers that look like generated names
    description: generated variables start with an uppercase letter, identifiers can't
    code: |
      func one() int {
        return 1
      }

      var_1 = "mine"
      lsh_i = "mine"
      lsh_bool_0 = "mine"
      lsh__funcretparam_0 = "mine"
      lsh__stdout = "mine"
      x = one() + 2
      b = x > 2
      o = try cmd("echo", "out", stdout: string)
      println(var_1, lsh_i, lsh_bool_0, lsh__funcretparam_0, lsh__stdout, x, b, o)
    expected: |
      mine mine mine mine mine 3 true out

  - name: env var in function
    code: |
      func env() string {
        return $LUSH_TEST
      }
      println(env())
    expected: |
      hello

  - name: variables don't hide env vars
    description: lowercase env vars like http_proxy are valid variable names
    code: |
      func env() string {
        return $lush_test
      }

      lush_test = "mine"
      out = try cmd("printenv", "lush_test", stdout: string)
      println(lush_test, $lush_test, env(), out)
    expected: |
      mine env env env

  - name: script arguments
    description: they are the same inside of functions
    args: ["a b", "", "c"]
    code: |
      func count() int {
        return len(args())
      }
      a = args()
      println(len(a), count(), a[0], a[2])
      println(args()[1] == "")
    expected: |
      3 3 a b c
      true

  - name: no script arguments
    code: |
      println(len(args()))
    expected: |
      0
