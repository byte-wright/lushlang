order: 3
name: Bash
tests:
  - name: bash fun
    description:
    code: |
      import "strings"

      println(strings.hasPrefix("foo", "f"))
      println(strings.hasPrefix("foo", "o"))
    expected: |
      true
      false


  - name: env var
    code: |
      v = $LUSH_TEST
      println(v)
    expected: |
      hello

  - name: env var in function
    code: |
      func env() string {
        return $LUSH_TEST
      }
      println(env())
    expected: |
      hello
