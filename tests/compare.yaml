order: 2
name: Compare
tests:
  - name: Basic operations
    description: Numbers in bash are all int32/64 depending on the system.
    code: |
      println("2 < 2", 2 < 2)
      println("2 <= 2", 2 <= 2)
      println("2 > 2", 2 > 2)
      println("2 >= 2", 2 >= 2)
      println("2 == 2", 2 == 2)
      println("2 != 2", 2 != 2)
    expected: |
      2 < 2 false
      2 <= 2 true
      2 > 2 false
      2 >= 2 true
      2 == 2 true
      2 != 2 false



  - name: Less or greater equal false
    code: |
      println(3 <= 2, 3 >= 4, 2 <= 3, 4 >= 3)
    expected: |
      false false true true

  - name: Equal strings and bools
    code: |
      a = "x y"
      println(a == "x y", a != "x y", a == "y", a != "y")
      println(true == false, true != false, false == false)
    expected: |
      true false false true
      false true true
