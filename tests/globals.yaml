order: 3
name: Globals
tests:
  - name: function reads a global
    code: |
      global greeting = "hello"

      func greet() {
        println(greeting)
      }

      greet()
    expected: |
      hello

  - name: env var cleaned up by a package function
    code: |
      import "strings"

      global value = strings.trimSuffix($LUSH_TEST, "lo")

      func show() {
        println(value)
      }

      show()
    expected: |
      hel

  - name: own function in an initial value
    code: |
      global value = clean($LUSH_TEST)

      func clean(s string) string {
        return s + "!"
      }

      println(value)
    expected: |
      hello!

  - name: builtins in an initial value
    args: ["a", "b"]
    code: |
      global all = args()
      global count = len(all)

      println(count, all[1])
    expected: |
      2 b

  - name: assigned in source order
    code: |
      println("start")

      global value = load()

      func load() int {
        println("loading")
        return 1
      }

      println(value)
    expected: |
      start
      loading
      1

  - name: function called after the assignment
    description: a function may use a global that is assigned later in the source, only the call has to come after it
    code: |
      func log(m string) {
        if verbose {
          println(m)
        }
      }

      global verbose = true
      log("start")
    expected: |
      start

  - name: function writes a global
    code: |
      global count = 0

      func increment() {
        global count = count + 1
      }

      increment()
      increment()
      println(count)
    expected: |
      2

  - name: write from a nested call and block
    code: |
      global state = "before"

      func outer() {
        if true {
          inner()
        }
      }

      func inner() {
        for i = 0; i < 1; i = i + 1 {
          global state = "after"
        }
      }

      outer()
      println(state)
    expected: |
      after

  - name: write at the top level
    code: |
      global state = 1

      global state = state + 1
      println(state)
    expected: |
      2

  - name: function writes a global without being a dependency
    code: |
      global a = 1

      func f() int {
        global a = a + 1
        return a
      }

      println(f())
      println(a)
    expected: |
      2
      2

  - name: read before a call that writes the global
    description: expressions are evaluated from left to right
    code: |
      global a = 1

      func f() int {
        global a = a + 1
        return a
      }

      println(a, f())
      x = a + f()
      println(x, a)
    expected: |
      1 2
      5 3

  - name: loop condition reads the global again
    code: |
      global limit = 3

      func shrink() {
        global limit = limit - 1
      }

      n = 0
      for i = 0; i < limit; i = i + 1 {
        shrink()
        n = n + 1
      }

      println(n, limit)
    expected: |
      2 1

  - name: value types
    code: |
      global text = "a  b"
      global word = "hello"
      global number = 6
      global on = true
      global off = !on

      println(text, number * 2 + 1, on, off, on ? "yes" : "no")
      if on {
        println(len(word), word[1:3], word[0])
      }
    expected: |
      a  b 13 true false yes
      5 el h

  - name: array global
    code: |
      global items = ["a b", "c"]
      global none = []string

      func add(s string) {
        global items = append(items, s)
      }

      func count(a []string) int {
        return len(a)
      }

      add("d  e")
      println(len(items), items[0], items[2], len(none), count(items), len(items[1:]))

      copied = items
      copied = append(copied, "f")
      println(len(copied), len(items))
    expected: |
      3 a b d  e 0 3 2
      4 3

  - name: swap
    code: |
      global a = 1
      global b = 2

      global a, b = b, a
      println(a, b)
    expected: |
      2 1

  - name: several values from one call
    code: |
      import "strings"

      global before, after, found = strings.cut("a-b", "-")
      global first, _, _ = strings.cut("c-d", "-")

      println(before, after, found, first)
    expected: |
      a b true c

  - name: blank definition still runs
    code: |
      global _ = load()

      func load() int {
        println("loading")
        return 1
      }
    expected: |
      loading

  - name: global named like an env var
    code: |
      global lush_test = "global"

      func show() {
        println($lush_test, lush_test)
      }

      show()
    expected: |
      env global

  - name: package globals are sorted by their references
    description: a package has no statements, so its globals get their values in the order their references need, also through functions. A write counts too, so c's own initial value doesn't overwrite it
    code: |
      import "./initorder"

      println(initorder.a, initorder.b, initorder.c)
    expected: |
      4 1 5

  - name: recursion in an initial value
    code: |
      global step = 2
      global total = sum(3)

      func sum(n int) int {
        if n == 0 {
          return 0
        }

        return step + sum(n - 1)
      }

      println(total)
    expected: |
      6

  - name: mutual recursion in an initial value
    code: |
      global even = isEven(4)

      func isEven(n int) bool {
        if n == 0 {
          return true
        }

        return isOdd(n - 1)
      }

      func isOdd(n int) bool {
        if n == 0 {
          return false
        }

        return isEven(n - 1)
      }

      println(even)
    expected: |
      true

  - name: package global
    description: visible in the whole package, also in its other files
    code: |
      import "./settings"

      println(settings.host, settings.url())
      settings.count()
      println(settings.count(), settings.calls)
    expected: |
      example.com https://example.com/api
      2 2

  - name: same global name in two packages
    code: |
      import "./settings"
      import "./other"

      global host = "main"

      println(host, settings.host, other.get())
    expected: |
      main example.com other.org

  - name: package global in an initial value
    code: |
      import "./settings"

      global address = settings.host + ":80"

      println(address)
    expected: |
      example.com:80

  - name: package initializes once
    code: |
      import "./once"
      import "./usesonce"

      println(once.value, usesonce.read())
    expected: |
      loading
      7 7

  - name: import cycle
    description: the order comes from references, not from imports
    code: |
      import "./importloopa"

      println(importloopa.a)
    expected: |
      11

  - name: external parameter named like a global
    description: the bash code of an external function can't see globals
    code: |
      import "./externalparam"

      println(externalparam.echo("param"), externalparam.value())
    expected: |
      param global

  - name: local named like a global of another package
    code: |
      import "./settings"
      import "./localname"

      global total = 5
      host = "local"

      println(host, settings.host, localname.run(), total)
    expected: |
      local example.com 2 5

  - name: function local named like a top level variable
    description: functions can't see the top level, each variable keeps its own type
    code: |
      x = "a"

      func f() int {
        x = 1
        return x + 1
      }

      func g(x int) int {
        return x * 2
      }

      println(f(), g(2), x)
    expected: |
      2 4 a

  - name: plain assignment in a function
    code: |
      global count = 0

      func f() {
        count = 1
      }
    errors:
      - globals/plain assignment in a function.lsh Ln:4 Col:3 count is a global variable, write it with global count = ... or use another name

  - name: plain assignment at the top level
    code: |
      global count = 0

      count = 1
    errors:
      - globals/plain assignment at the top level.lsh Ln:3 Col:1 count is a global variable, write it with global count = ... or use another name

  - name: loop variable named like a global
    code: |
      global i = 0

      func f() {
        for i = 0; i < 1; i = i + 1 {
        }
      }
    errors:
      - globals/loop variable named like a global.lsh Ln:4 Col:7 i is a global variable, write it with global i = ... or use another name
      - globals/loop variable named like a global.lsh Ln:4 Col:21 i is a global variable, write it with global i = ... or use another name

  - name: parameter named like a global
    code: |
      global host = ""

      func f(host string) {
      }
    errors:
      - globals/parameter named like a global.lsh Ln:3 Col:8 parameter host has the name of a global variable

  - name: name clash is not reported as an early use
    code: |
      global a = f(1)

      func f(a int) int {
        return a
      }
    errors:
      - globals/name clash is not reported as an early use.lsh Ln:3 Col:8 parameter a has the name of a global variable

  - name: write to an undefined global
    code: |
      func f() {
        global missing = 1
      }
    errors:
      - globals/write to an undefined global.lsh Ln:2 Col:10 global variable missing is not defined

  - name: global in a block does not define it
    description: only the top level outside of blocks defines a global, a block might not run
    code: |
      if true {
        global x = 1
      }
    errors:
      - globals/global in a block does not define it.lsh Ln:2 Col:10 global variable x is not defined

  - name: local named like a later global
    code: |
      x = 1
      global x = 2
    errors:
      - globals/local named like a later global.lsh Ln:1 Col:1 x is a global variable, write it with global x = ... or use another name

  - name: assigned again with another type
    code: |
      global a = 1
      global a = "s"
    errors:
      - globals/assigned again with another type.lsh Ln:2 Col:8 you cannot assign an string value to the variable 'a' of type int

  - name: defined in two files of a package
    code: |
      import "./dupglobal"
    errors:
      - std/dupglobal/b.lsh Ln:1 Col:8 global variable x is already defined at std/dupglobal/a.lsh Ln:1 Col:8

  - name: wrong type in a write
    code: |
      global count = 0

      func f() {
        global count = "s"
      }
    errors:
      - globals/wrong type in a write.lsh Ln:4 Col:10 you cannot assign an string value to the variable 'count' of type int

  - name: wrong number of values
    code: |
      global a, b = 1

      println(a, b)
    errors:
      - globals/wrong number of values.lsh Ln:1 Col:8 Wrong number of expressions

  - name: operator on a global
    code: |
      global text = "a"

      println(text * 2)
    errors:
      - globals/operator on a global.lsh Ln:3 Col:9 operator '*' can't be used with string and int

  - name: initial value without a value
    code: |
      global a = f()

      func f() {
      }
    errors:
      - globals/initial value without a value.lsh Ln:1 Col:12 f doesn't return a value

  - name: unknown function in an initial value
    code: |
      global a = missing()
    errors:
      - globals/unknown function in an initial value.lsh Ln:1 Col:12 function missing not found

  - name: top level variable in the value of a global
    description: the value is evaluated in place, so it can use what the top level defined before
    code: |
      b = 1
      global a = b

      println(a)
    expected: |
      1

  - name: unknown namespace
    code: |
      println(nope.value)
    errors:
      - globals/unknown namespace.lsh Ln:1 Col:9 namespace nope not found

  - name: unknown global in a namespace
    code: |
      import "./settings"

      println(settings.missing)
    errors:
      - globals/unknown global in a namespace.lsh Ln:3 Col:9 variable missing in namespace settings not found

  - name: package global needs its namespace
    code: |
      import "./settings"

      println(host)
    errors:
      - globals/package global needs its namespace.lsh Ln:3 Col:9 variable 'host' is not defined

  - name: package does not see the globals of main
    code: |
      import "./noglobals"

      global fromMain = 1

      println(noglobals.run())
    errors:
      - std/noglobals/noglobals.lsh Ln:2 Col:10 variable 'fromMain' is not defined

  - name: read before the assignment
    code: |
      global a = b + 1
      global b = 1
    errors:
      - globals/read before the assignment.lsh Ln:1 Col:12 b is used before it is assigned at globals/read before the assignment.lsh Ln:2 Col:8

  - name: self reference
    code: |
      global a = a
    errors:
      - globals/self reference.lsh Ln:1 Col:12 a is used before it is assigned at globals/self reference.lsh Ln:1 Col:8

  - name: use in a block before the assignment
    code: |
      if true {
        println(x)
      }
      for i = 0; i < 1; i = i + 1 {
        global x = 2
      }
      global x = 1
    errors:
      - globals/use in a block before the assignment.lsh Ln:2 Col:11 x is used before it is assigned at globals/use in a block before the assignment.lsh Ln:7 Col:8
      - globals/use in a block before the assignment.lsh Ln:5 Col:10 x is used before it is assigned at globals/use in a block before the assignment.lsh Ln:7 Col:8

  - name: call before the assignment
    code: |
      log("start")
      global verbose = true

      func log(m string) {
        if verbose {
          println(m)
        }
      }
    errors:
      - globals/call before the assignment.lsh Ln:1 Col:1 log uses verbose before it is assigned at globals/call before the assignment.lsh Ln:2 Col:8

  - name: call in the value of the global it uses
    code: |
      global a = f()

      func f() int {
        return a
      }
    errors:
      - globals/call in the value of the global it uses.lsh Ln:1 Col:12 f uses a before it is assigned at globals/call in the value of the global it uses.lsh Ln:1 Col:8

  - name: use through nested functions before the assignment
    code: |
      global a = f()
      global b = 2

      func f() int {
        return g() * 2
      }

      func g() int {
        return b
      }
    errors:
      - globals/use through nested functions before the assignment.lsh Ln:1 Col:12 f -> g uses b before it is assigned at globals/use through nested functions before the assignment.lsh Ln:2 Col:8

  - name: write through a call before the assignment
    description: the assignment would overwrite the value the function wrote
    code: |
      global a = setB()
      global b = 0

      func setB() int {
        global b = 5
        return 1
      }
    errors:
      - globals/write through a call before the assignment.lsh Ln:1 Col:12 setB uses b before it is assigned at globals/write through a call before the assignment.lsh Ln:2 Col:8

  - name: use in a branch that never runs
    code: |
      global a = f(false)

      func f(use bool) int {
        if use {
          return a
        }

        return 1
      }
    errors:
      - globals/use in a branch that never runs.lsh Ln:1 Col:12 f uses a before it is assigned at globals/use in a branch that never runs.lsh Ln:1 Col:8

  - name: one error per global and statement
    code: |
      global a = f() + g() + b
      global b = 1

      func f() int {
        return b
      }

      func g() int {
        return b
      }
    errors:
      - globals/one error per global and statement.lsh Ln:1 Col:12 f uses b before it is assigned at globals/one error per global and statement.lsh Ln:2 Col:8

  - name: cycle in a package found through a function that was already followed
    code: |
      import "./cyclefollowed"
    errors:
      - "std/cyclefollowed/cyclefollowed.lsh Ln:2 Col:8 initialization cycle: cyclefollowed.b -> cyclefollowed.g -> cyclefollowed.f -> cyclefollowed.b"

  - name: two cycles in a package through one function
    code: |
      import "./twocycles"
    errors:
      - "std/twocycles/twocycles.lsh Ln:1 Col:8 initialization cycle: twocycles.a -> twocycles.f -> twocycles.a"
      - "std/twocycles/twocycles.lsh Ln:2 Col:8 initialization cycle: twocycles.b -> twocycles.f -> twocycles.b"

  - name: cycle across packages
    code: |
      import "./initloopa"
    errors:
      - "std/initloopa/a.lsh Ln:3 Col:8 initialization cycle: initloopa.a -> initloopb.viaA -> initloopa.read -> initloopa.a"

  - name: var is no keyword
    code: |
      var = 1
      println(var)
    expected: |
      1

  - name: write to the global of another package
    code: |
      import "./settings"

      global settings.host = "x"
    errors:
      - "globals/write to the global of another package.lsh Ln:3 Col:16 mismatched input '.' expecting {',', '=', '+=', '-=', '*=', '/=', '%='}"

  - name: plain write to the global of another package
    code: |
      import "./settings"

      settings.host = "x"
    errors:
      - "globals/plain write to the global of another package.lsh Ln:3 Col:15 mismatched input '=' expecting '('"

  - name: uppercase global
    code: |
      global Host = 1
    errors:
      - globals/uppercase global.lsh Ln:1 Col:8 name Host must start with a lowercase letter
