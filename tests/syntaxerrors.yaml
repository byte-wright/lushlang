tests:
  - name: missing paren
    code: |
      println("a"
      println("after")
    errors:
      - "syntaxerrors/missing paren.lsh:2:1: mismatched input 'println' expecting {')', ','}"

  - name: invalid escapes
    description: one error for each, at its backslash
    code: |
      a = "x\qy"
      b = "\x4g\u12" + "\'"
      c = "line
        \z"
      d = "\x00\000\u0000"
      e = "\ud800\U00110000\400"
      f = "a\
      b"
    errors:
      - "syntaxerrors/invalid escapes.lsh:1:7: unknown escape \\q"
      - "syntaxerrors/invalid escapes.lsh:2:6: escape \\x needs 2 hex digits"
      - "syntaxerrors/invalid escapes.lsh:2:10: escape \\u needs 4 hex digits of a valid code point"
      - "syntaxerrors/invalid escapes.lsh:2:19: unknown escape \\'"
      - "syntaxerrors/invalid escapes.lsh:4:3: unknown escape \\z"
      - "syntaxerrors/invalid escapes.lsh:5:6: strings can't hold NUL"
      - "syntaxerrors/invalid escapes.lsh:5:10: strings can't hold NUL"
      - "syntaxerrors/invalid escapes.lsh:5:14: strings can't hold NUL"
      - "syntaxerrors/invalid escapes.lsh:6:6: escape \\u needs 4 hex digits of a valid code point"
      - "syntaxerrors/invalid escapes.lsh:6:12: escape \\U needs 8 hex digits of a valid code point"
      - "syntaxerrors/invalid escapes.lsh:6:22: octal escape needs 3 digits from \\000 to \\377"
      - "syntaxerrors/invalid escapes.lsh:7:7: unknown escape, \\ is followed by U+000A"

  - name: invalid token
    code: |
      x = 1 #
    errors:
      - "syntaxerrors/invalid token.lsh:1:7: token recognition error at: '#'"

  - name: return value on the next line
    code: |
      func f() int {
        return
          1
      }
    errors:
      - "syntaxerrors/return value on the next line.lsh:3:5: no viable alternative at input '1'"

  - name: call on a value
    description: only package functions can be called with a dot, values have no methods
    code: |
      println("abc".hasPrefix("a"))
    errors:
      - "syntaxerrors/call on a value.lsh:1:14: mismatched input '.' expecting {')', ','}"
      - "syntaxerrors/call on a value.lsh:1:29: extraneous input ')' expecting {<EOF>, 'if', 'for', 'func', 'return', 'break', 'continue', 'global', 'try', 'fail', 'cmd', ID}"

  - name: call on the result of a call
    code: |
      import "strings"
      println(strings.trimPrefix("abc", "a").hasPrefix("b"))
    errors:
      - "syntaxerrors/call on the result of a call.lsh:2:39: mismatched input '.' expecting {')', ','}"
      - "syntaxerrors/call on the result of a call.lsh:2:54: extraneous input ')' expecting {<EOF>, 'if', 'for', 'func', 'return', 'break', 'continue', 'global', 'try', 'fail', 'cmd', ID}"

  - name: nested array type
    description: bash arrays can't be nested
    code: |
      func f(a [][]int) {
      }
    errors:
      - "syntaxerrors/nested array type.lsh:1:12: mismatched input '[' expecting {'string', 'int', 'bool'}"

  - name: uppercase names
    description: names are written one way, they start with a lowercase letter or _
    code: |
      import "strings"
      URL = "x"
      myURL = URL + $HOME_DIR
      before, _, _ = strings.Cut(myURL, "/")
      func Fetch(IFS string) {
      }
    errors:
      - "syntaxerrors/uppercase names.lsh:2:1: name URL must start with a lowercase letter"
      - "syntaxerrors/uppercase names.lsh:3:9: name URL must start with a lowercase letter"
      - "syntaxerrors/uppercase names.lsh:4:24: name Cut must start with a lowercase letter"
      - "syntaxerrors/uppercase names.lsh:5:6: name Fetch must start with a lowercase letter"
      - "syntaxerrors/uppercase names.lsh:5:12: name IFS must start with a lowercase letter"

  - name: uppercase names in a package
    description: the rule holds in packages and for the parameters of external functions
    code: |
      import "./uppercase"
    errors:
      - "std/uppercase/uppercase.lsh:1:11: name IFS must start with a lowercase letter"
