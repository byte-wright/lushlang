order: 3
name: SyntaxErrors
tests:
  - name: missing paren
    code: |
      println("a"
      println("after")
    errors:
      - "syntaxerrors/missing paren.lsh Ln:2 Col:1 mismatched input 'println' expecting {')', ','}"

  - name: invalid token
    code: |
      x = 1 #
    errors:
      - "syntaxerrors/invalid token.lsh Ln:1 Col:7 token recognition error at: '#'"

  - name: return value on the next line
    code: |
      func f() int {
        return
          1
      }
    errors:
      - "syntaxerrors/return value on the next line.lsh Ln:3 Col:5 no viable alternative at input '1'"

  - name: call on a value
    description: only package functions can be called with a dot, values have no methods
    code: |
      println("abc".hasPrefix("a"))
    errors:
      - "syntaxerrors/call on a value.lsh Ln:1 Col:14 mismatched input '.' expecting {')', ','}"
      - "syntaxerrors/call on a value.lsh Ln:1 Col:29 extraneous input ')' expecting {<EOF>, 'if', 'for', 'func', 'return', ID}"

  - name: call on the result of a call
    code: |
      import "strings"
      println(strings.trimPrefix("abc", "a").hasPrefix("b"))
    errors:
      - "syntaxerrors/call on the result of a call.lsh Ln:2 Col:39 mismatched input '.' expecting {')', ','}"
      - "syntaxerrors/call on the result of a call.lsh Ln:2 Col:54 extraneous input ')' expecting {<EOF>, 'if', 'for', 'func', 'return', ID}"

  - name: nested array type
    description: bash arrays can't be nested
    code: |
      func f(a [][]int) {
      }
    errors:
      - "syntaxerrors/nested array type.lsh Ln:1 Col:12 mismatched input '[' expecting {'string', 'int', 'bool'}"

  - name: uppercase names
    description: names start lowercase, so they can't clash with bash variables like PATH or IFS
    code: |
      import "strings"
      URL = "x"
      myURL = URL + $HOME_DIR
      before, _, _ = strings.Cut(myURL, "/")
      func Fetch(IFS string) {
      }
    errors:
      - "syntaxerrors/uppercase names.lsh Ln:2 Col:1 name URL must start with a lowercase letter"
      - "syntaxerrors/uppercase names.lsh Ln:3 Col:9 name URL must start with a lowercase letter"
      - "syntaxerrors/uppercase names.lsh Ln:4 Col:24 name Cut must start with a lowercase letter"
      - "syntaxerrors/uppercase names.lsh Ln:5 Col:6 name Fetch must start with a lowercase letter"
      - "syntaxerrors/uppercase names.lsh Ln:5 Col:12 name IFS must start with a lowercase letter"

  - name: uppercase names in a package
    description: parameters of external functions keep their names in bash, so IFS would change how bash splits words
    code: |
      import "/uppercase"
    errors:
      - "std/uppercase/uppercase.lsh Ln:1 Col:11 name IFS must start with a lowercase letter"
