order: 3
name: Strings
tests:
  - name: prefix/suffix
    description: Prefix/suffix operations match against strings and not globs.
    code: |
      import "strings"

      println(strings.hasPrefix("fooBar", "foo"), strings.hasPrefix("fooBar", "no"))
      println(strings.trimPrefix("fooBar", "foo"), strings.trimPrefix("fooBar", "no"))
      println(strings.hasSuffix("fooBar", "Bar"), strings.hasSuffix("fooBar", "no"))
      println(strings.trimSuffix("fooBar", "Bar"), strings.trimSuffix("fooBar", "no"))
      println(strings.hasPrefix("abc", "*b"), strings.trimPrefix("abc", "*b"))
      println(strings.hasSuffix("abc", "b*"), strings.trimSuffix("abc", "b*"))
    expected: |
      true false
      Bar fooBar
      true false
      foo fooBar
      false abc
      false abc

  - name: substring
    description: To get a substring slice notation can be used.
    code: |
      println("abcdef"[0:3], "abcdef"[:3])
      println("abcdef"[3:6], "abcdef"[3:])
    expected: |
      abc abc
      def def


  - name: len
    description: Count characters in a string
    code: |
      println("abcdef", len("abcdef"))
      println("", len(""))
    expected: |
      abcdef 6
       0


  - name: indexOf
    description: Index of first occurence of string
    code: |
      import "strings"

      println(strings.indexOf("abrcdrrerrfr", "rr"))
      println(strings.indexOf("C:\\new", "n"), strings.indexOf("a\\tb", "b"))
      println(strings.indexOf("a*b", "*"), strings.indexOf("ab", "*"), strings.indexOf("abc", "x"))
      println(strings.indexOf("abc", ""), strings.indexOf("", ""), strings.indexOf("", "a"))
    expected: |
      5
      3 3
      1 -1 -1
      0 0 -1

  - name: cut
    description: Cut splits at the first separator, without one the whole string comes first
    code: |
      import "strings"

      before, after, found = strings.cut("feature-login-page", "-")
      println(before, after, found)
      before, after, found = strings.cut("main", "-")
      println(before, after + "|", found)
      before, after, found = strings.cut("C:\\new*", "\\")
      println(before, after, found)
    expected: |
      feature login-page true
      main | false
      C: new* true


  - name: escapes
    code: |
      println("a\\nb", "say \"hi\"", "x\ny")
    expected: |
      a\nb say "hi" x
      y

  - name: concatenation
    code: |
      a = "foo"
      b = a + " bar" + "'s"
      println(b, "x" + a, $LUSH_TEST + "!")
    expected: |
      foo bar's xfoo hello!

  - name: index
    code: |
      s = "abc"
      i = 1
      println(s[0], s[i + 1], "xyz"[i])
    expected: |
      a c y

  - name: package call in an expression
    description: the operators around a call apply to its result
    code: |
      import "strings"

      println(!strings.hasPrefix("abc", "a"), strings.trimPrefix("xabc", "x")[1], strings.trimPrefix("xabc", "x")[1:])
      println(strings.indexOf("abc", "c") * 2 + 1)
    expected: |
      false b bc
      5
