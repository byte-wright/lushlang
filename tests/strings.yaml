tests:
  - name: prefix/suffix
    description: Prefix/suffix operations match against strings and not globs.
    code: |
      import "strings"

      println(strings.hasPrefix("fooBar", "foo"), strings.hasPrefix("fooBar", "no"))
      println(strings.trimPrefix("fooBar", "foo"), strings.trimPrefix("fooBar", "no"))
      println(strings.hasSuffix("fooBar", "Bar"), strings.hasSuffix("fooBar", "no"))
      println(strings.trimSuffix("fooBar", "Bar"), strings.trimSuffix("fooBar", "no"))
      println(strings.hasPrefix("abc", "*b"), strings.trimPrefix("abc", "*b"))
      println(strings.hasSuffix("abc", "b*"), strings.trimSuffix("abc", "b*"))
    expected: |
      true false
      Bar fooBar
      true false
      foo fooBar
      false abc
      false abc

  - name: substring
    description: To get a substring slice notation can be used.
    code: |
      println("abcdef"[0:3], "abcdef"[:3])
      println("abcdef"[3:6], "abcdef"[3:])
    expected: |
      abc abc
      def def


  - name: len
    description: Count characters in a string
    code: |
      println("abcdef", len("abcdef"))
      println("", len(""))
    expected: |
      abcdef 6
       0


  - name: indexOf
    description: Index of first occurence of string
    code: |
      import "strings"

      println(strings.indexOf("abrcdrrerrfr", "rr"))
      println(strings.indexOf("C:\\new", "n"), strings.indexOf("a\\tb", "b"))
      println(strings.indexOf("a*b", "*"), strings.indexOf("ab", "*"), strings.indexOf("abc", "x"))
      println(strings.indexOf("abc", ""), strings.indexOf("", ""), strings.indexOf("", "a"))
    expected: |
      5
      3 3
      1 -1 -1
      0 0 -1

  - name: cut
    description: Cut splits at the first separator, without one the whole string comes first
    code: |
      import "strings"

      before, after, found = strings.cut("feature-login-page", "-")
      println(before, after, found)
      before, after, found = strings.cut("main", "-")
      println(before, after + "|", found)
      before, after, found = strings.cut("C:\\new*", "\\")
      println(before, after, found)
    expected: |
      feature login-page true
      main | false
      C: new* true


  - name: escapes
    code: |
      println("a\\nb", "say \"hi\"", "x\ny")
    expected: |
      a\nb say "hi" x
      y

  - name: go escapes
    description: od shows the bytes bash got, \xff and \377 are single bytes, not UTF-8
    code: |
      import "strings"

      out = try cmd("od", "-An", "-tx1", "-v", stdin: "\a\b\f\n\r\t\v\\\"\x1b\xff\377", stdout: string)
      println(strings.trimSpace(out))
      println("\x41\102é\U0001F600" == "ABé😀", "\033[1m" == "\x1b[1m")
    expected: |
      07 08 0c 0a 0d 09 0b 5c 22 1b ff ff
      true true

  - name: concatenation
    code: |
      a = "foo"
      b = a + " bar" + "'s"
      println(b, "x" + a, $LUSH_TEST + "!")
    expected: |
      foo bar's xfoo hello!

  - name: index
    code: |
      s = "abc"
      i = 1
      println(s[0], s[i + 1], "xyz"[i])
    expected: |
      a c y

  - name: package call in an expression
    description: the operators around a call apply to its result
    code: |
      import "strings"

      println(!strings.hasPrefix("abc", "a"), strings.trimPrefix("xabc", "x")[1], strings.trimPrefix("xabc", "x")[1:])
      println(strings.indexOf("abc", "c") * 2 + 1)
    expected: |
      false b bc
      5

  - name: utf-8
    description: len, index and slice count characters, not bytes
    code: |
      import "strings"

      s = "héllo€"
      println(len(s), s[1], s[5], s[1:4], s[3:])
      println(strings.indexOf("héllo wörld", "w"), strings.indexOf("€uro", "u"))
    expected: |
      6 é € éll lo€
      6 1

  - name: utf-8 in the C locale
    description: the user's locale doesn't change how strings count, and commands and env reads still see it
    env: [LC_ALL=C]
    code: |
      import "strings"

      s = "héllo€"
      println(len(s), s[1], s[5], s[1:4], s[3:])
      println(strings.indexOf("héllo wörld", "w"), strings.indexOf("€uro", "u"))
      println($LC_ALL, try cmd("printenv", "LC_ALL", stdout: string))
    expected: |
      6 é € éll lo€
      6 1
      C C

  - name: invalid utf-8
    description: every byte that isn't part of a valid character counts as one
    env: [LC_ALL=C]
    code: |
      s = try cmd("printf", "a\\377b\\303", stdout: string)
      println(len(s), s[2])
    expected: |
      4 b

  - name: contains
    code: |
      import "strings"

      println(strings.contains("seafood", "foo"), strings.contains("seafood", "bar"))
      println(strings.contains("abc", ""), strings.contains("", ""), strings.contains("", "a"))
      println(strings.contains("a*b", "*"), strings.contains("ab", "*"), strings.contains("ab", "?"))
    expected: |
      true false
      true true false
      true false false

  - name: split
    description: like Go, every separator splits, also at the ends, and an empty one splits into characters
    code: |
      import "strings"

      func show(parts []string) {
        println(len(parts), strings.join(parts, "|"))
      }

      show(strings.split("a,b,,c", ","))
      show(strings.split("a,", ","))
      show(strings.split(",", ","))
      show(strings.split("", ","))
      show(strings.split("abc", "abcd"))
      show(strings.split("a<->b<-c", "<->"))
      show(strings.split("aaaa", "aa"))
      show(strings.split("a*b?c", "*"))
      show(strings.split("line 1\nline 2\n", "\n"))
      show(strings.split("héllo", ""))
      show(strings.split("", ""))
    expected: |
      4 a|b||c
      2 a|
      2 |
      1 
      1 abc
      2 a|b<-c
      3 ||
      2 a|b?c
      3 line 1|line 2|
      5 h|é|l|l|o
      0 

  - name: replaceAll
    description: old and new are text, not patterns, & and \ in new are no back references
    code: |
      import "strings"

      println(strings.replaceAll("oink oink oink", "k", "ky"), strings.replaceAll("oink", "x", "y"))
      println(strings.replaceAll("aaa", "aa", "b"), strings.replaceAll("x*y*", "*", "[*]"))
      println(strings.replaceAll("a&b", "&", "\\&"), strings.replaceAll("ab", "b", "&&"))
      println(strings.replaceAll("say \"hi\" \\o/", "\\", "\\\\"), strings.replaceAll("say \"hi\"", "\"", "\\\""))
      println(strings.replaceAll("é€é", "€", "e"), strings.replaceAll("abc", "b", ""))
      println(strings.replaceAll("abc", "", "-"), strings.replaceAll("", "", "-"), strings.replaceAll("é", "", "|"))
    expected: |
      oinky oinky oinky oink
      ba x[*]y[*]
      a\&b a&&
      say "hi" \\o/ say \"hi\"
      éeé ac
      -a-b-c- - |é|

  - name: trimSpace
    code: |
      import "strings"

      cr = try cmd("printf", "\\r\\v\\f", stdout: string)
      println("<" + strings.trimSpace(" \t\n a  b " + cr + "\n ") + ">")
      println("<" + strings.trimSpace(cr + "x" + cr) + ">", "<" + strings.trimSpace(" \n ") + ">", "<" + strings.trimSpace("") + ">")
    expected: |
      <a  b>
      <x> <> <>

  - name: case conversion
    description: only the ASCII letters change
    code: |
      import "strings"

      println(strings.toUpper("Hello, wörld-é 123"), strings.toLower("HELLO, WÖRLD-É ABC"))
      println(strings.toUpper("") + "|", strings.toLower("[a-z] *"))
    expected: |
      HELLO, WöRLD-é 123 hello, wÖrld-É abc
      | [a-z] *

  - name: utf-8 functions in the C locale
    env: [LC_ALL=C]
    code: |
      import "strings"

      parts = strings.split("a€b€€c", "€")
      println(len(parts), strings.join(parts, "|"), len(strings.split("héllo", "")))
      println(strings.replaceAll("é€é", "€", "e"), strings.replaceAll("é", "", "|"), strings.contains("wörld", "ö"))
      println(strings.toUpper("é-a"), strings.trimSpace(" é "))
    expected: |
      4 a|b||c 5
      éeé |é| true
      é-A é
