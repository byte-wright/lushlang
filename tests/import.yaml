order: 3
name: Import
tests:
  - name: imported methods
    description:
    code: |
      import "/math"

      println(math.add(5, 3))
      println(math.sub(5, 3))
    expected: |
      8
      2


  - name: method as statement
    code: |
      import "/greet"
      import "/math"

      greet.hello("world")
      math.add(1, 2)
    expected: |
      hello world

  - name: own package function
    description: an unqualified call in a package goes to its own package, not to main
    code: |
      import "/math"

      println(math.double(4))
      println(add(1, 2))

      func add(a int, b int) int {
        return 100
      }
    expected: |
      8
      100

  - name: same package name in different files
    code: |
      import "strings"
      import "/greet"

      greet.shout("world")
      println(strings.hasPrefix("world", "w"))
    expected: |
      hello world!
      true

  - name: same package name in one file
    code: |
      import "strings"
      import "/strings"
    errors:
      - import/same package name in one file.lsh Ln:2 Col:1 package strings is already imported from "strings"

  - name: package scope
    description: a package sees neither the imports nor the functions of the main file
    code: |
      import "/math"
      import "/isolated"

      println(isolated.run())

      func mainOnly() int {
        return 1
      }
    errors:
      - std/isolated/isolated.lsh Ln:2 Col:15 namespace math not found
      - std/isolated/isolated.lsh Ln:2 Col:27 function mainOnly not found

  - name: missing package
    description: missing packages are reported at the import that added them, also in packages
    code: |
      import "nope"
      import "/gone"
      import "/../std"
      import "/broken"

      println(nope.foo())
    errors:
      - import/missing package.lsh Ln:1 Col:1 package "nope" not found
      - import/missing package.lsh Ln:2 Col:1 package "/gone" not found
      - import/missing package.lsh Ln:3 Col:1 package "/../std" not found
      - std/broken/broken.lsh Ln:1 Col:1 package "/missing" not found

  - name: invalid package name
    description: code can't refer to these packages, the error is at the import instead of misleading ones at a use
    code: |
      import "/my-pkg"
      import "/MyPkg"
      import "/if"

      println(my-pkg.foo())
    errors:
      - import/invalid package name.lsh Ln:1 Col:1 package "/my-pkg" needs a name with as, the folder name my-pkg must start with a lowercase letter or _ and contain only letters, digits and _
      - import/invalid package name.lsh Ln:2 Col:1 package "/MyPkg" needs a name with as, the folder name MyPkg must start with a lowercase letter or _ and contain only letters, digits and _
      - import/invalid package name.lsh Ln:3 Col:1 package "/if" needs a name with as, the folder name if is a keyword

  - name: import with a name
    code: |
      import "strings" as str
      import "/strings" as mystrings

      println(str.hasPrefix("world", "w"), mystrings.shout("hi"))
    expected: |
      true hi!

  - name: only the new name
    code: |
      import "strings" as str

      println(strings.hasPrefix("a", "a"))
    errors:
      - import/only the new name.lsh Ln:3 Col:17 namespace strings not found

  - name: a name for a folder that can't be one
    code: |
      import "/my-pkg" as mypkg
      import "/if" as iff

      println(mypkg.foo(), iff.foo())
    expected: |
      1 1

  - name: one package with two names
    code: |
      import "/math" as a
      import "/math" as b

      println(a.add(1, 2), b.sub(5, 3))
    expected: |
      3 2

  - name: the name is per file
    description: aliased imports /math as m, the package is still loaded once
    code: |
      import "/aliased"
      import "/math"

      println(aliased.triple(2), math.add(1, 1))
    expected: |
      6 2

  - name: name already used
    code: |
      import "/math" as strings
      import "strings"
      import "/greet" as m
      import "/math" as m
    errors:
      - import/name already used.lsh Ln:2 Col:1 package strings is already imported from "/math"
      - import/name already used.lsh Ln:4 Col:1 package m is already imported from "/greet"

  - name: uppercase name after as
    code: |
      import "/math" as Math
    errors:
      - import/uppercase name after as.lsh Ln:1 Col:19 name Math must start with a lowercase letter

  - name: package function shadows a builtin only in its package
    code: |
      import "/shadow"

      println(len("abc"), shadow.len("abc"), shadow.size("abc"))
    expected: |
      3 42 42
